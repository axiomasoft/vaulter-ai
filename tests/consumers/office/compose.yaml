services:
  postgres:
    image: ${IMAGE_POSTGRES:-postgres:18.7}
    environment:
      POSTGRES_USER: ${PG_USER:-vaulter}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD must be generated by stack.sh prepare}
      POSTGRES_DB: ${PG_DB:-vaulter_ai_office}
      PGDATA: /data/pgdata
    volumes:
      - pgdata:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-vaulter} -d ${PG_DB:-vaulter_ai_office}"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ${FIXTURE_HOST_DIR:-./.sample/host}
      dockerfile: ${STAND_DIR:-.}/docker/Dockerfile.php
      target: runtime
    image: vaulter-ai-stand-php:${STAND_RUN_ID:-sample}
    environment:
      APP_ENV: testing
      APP_KEY: ${APP_KEY:?APP_KEY must be generated by stack.sh prepare}
      APP_URL: http://owner-http:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${PG_DB:-vaulter_ai_office}
      DB_USERNAME: ${PG_USER:-vaulter}
      DB_PASSWORD: ${PG_PASSWORD:?}
      STAND_PROFILE: ${STAND_PROFILE:-ai-text}
      VAULTER_ID_STRATEGY: uuid7
      VAULTER_HOST_KEYS: bigint
      VAULTER_PERMISSION_DRIVER: database
    command: ["sh", "-c", "php artisan migrate --force --no-interaction && php artisan stand:verify-schema"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  owner-http:
    init: true
    build:
      context: ${FIXTURE_HOST_DIR:-./.sample/host}
      dockerfile: ${STAND_DIR:-.}/docker/Dockerfile.php
      target: runtime
    image: vaulter-ai-stand-php:${STAND_RUN_ID:-sample}
    environment:
      APP_ENV: testing
      APP_KEY: ${APP_KEY:?}
      APP_URL: http://owner-http:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${PG_DB:-vaulter_ai_office}
      DB_USERNAME: ${PG_USER:-vaulter}
      DB_PASSWORD: ${PG_PASSWORD:?}
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: array
      STAND_PROFILE: ${STAND_PROFILE:-ai-text}
      VAULTER_ID_STRATEGY: uuid7
      VAULTER_HOST_KEYS: bigint
      VAULTER_PERMISSION_DRIVER: database
      FIXTURE_TOKEN: ${FIXTURE_TOKEN:?}
      VAULTER_AI_DETERMINISTIC_SCRIPT: ${VAULTER_AI_DETERMINISTIC_SCRIPT:-1}
      DB_QUEUE_RETRY_AFTER: ${DB_QUEUE_RETRY_AFTER:-100}
      PHP_CLI_SERVER_WORKERS: "8"
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000", "--no-reload"]
    ports:
      - "127.0.0.1:${OWNER_HTTP_PORT:-18000}:8000"
    volumes:
      - media:/app/storage/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(str_contains((string)@file_get_contents(\"http://127.0.0.1:8000/_fixture/readyz\"),\"ready\")?0:1);'"]
      interval: 3s
      timeout: 3s
      retries: 25

  agent-worker:
    init: true
    image: vaulter-ai-stand-php:${STAND_RUN_ID:-sample}
    environment:
      APP_ENV: testing
      APP_KEY: ${APP_KEY:?}
      APP_URL: http://owner-http:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${PG_DB:-vaulter_ai_office}
      DB_USERNAME: ${PG_USER:-vaulter}
      DB_PASSWORD: ${PG_PASSWORD:?}
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: array
      STAND_PROFILE: ${STAND_PROFILE:-ai-text}
      VAULTER_ID_STRATEGY: uuid7
      VAULTER_HOST_KEYS: bigint
      VAULTER_PERMISSION_DRIVER: database
      VAULTER_AI_DETERMINISTIC_SCRIPT: ${VAULTER_AI_DETERMINISTIC_SCRIPT:-1}
      DB_QUEUE_RETRY_AFTER: ${DB_QUEUE_RETRY_AFTER:-100}
      VAULTER_AI_WORKER_TIMEOUT: "75"
      VAULTER_AI_QUEUE_RETRY_AFTER: "100"
      VAULTER_AI_STOP_GRACE_PERIOD: "90"
      VAULTER_AI_PROVIDER: ${VAULTER_AI_PROVIDER:-openai}
      VAULTER_AI_MODEL: ${VAULTER_AI_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${VAULTER_AI_PROVIDER_KEY:-}
    command: ["php", "artisan", "queue:work", "database", "--queue=office-agent", "--timeout=75", "--tries=3", "--sleep=1"]
    stop_grace_period: 90s
    volumes:
      - media:/app/storage/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  projection-worker:
    image: vaulter-ai-stand-php:${STAND_RUN_ID:-sample}
    environment:
      APP_ENV: testing
      APP_KEY: ${APP_KEY:?}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${PG_DB:-vaulter_ai_office}
      DB_USERNAME: ${PG_USER:-vaulter}
      DB_PASSWORD: ${PG_PASSWORD:?}
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: array
      STAND_PROFILE: ${STAND_PROFILE:-ai-text}
      VAULTER_ID_STRATEGY: uuid7
      VAULTER_HOST_KEYS: bigint
      VAULTER_PERMISSION_DRIVER: database
      DB_QUEUE_RETRY_AFTER: ${DB_QUEUE_RETRY_AFTER:-100}
    command: ["php", "artisan", "queue:work", "database", "--queue=office-projections", "--timeout=75", "--tries=3", "--sleep=1"]
    stop_grace_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  scheduler:
    image: vaulter-ai-stand-php:${STAND_RUN_ID:-sample}
    environment:
      APP_ENV: testing
      APP_KEY: ${APP_KEY:?}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${PG_DB:-vaulter_ai_office}
      DB_USERNAME: ${PG_USER:-vaulter}
      DB_PASSWORD: ${PG_PASSWORD:?}
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: array
      STAND_PROFILE: ${STAND_PROFILE:-ai-text}
      VAULTER_ID_STRATEGY: uuid7
      VAULTER_HOST_KEYS: bigint
      VAULTER_PERMISSION_DRIVER: database
    command: ["php", "artisan", "schedule:work"]
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  browser-test:
    profiles: ["browser"]
    build:
      context: ${STAND_DIR:-.}
      dockerfile: docker/Dockerfile.browser
    image: vaulter-ai-stand-browser:${STAND_RUN_ID:-sample}
    environment:
      OWNER_HTTP_URL: http://owner-http:8000
      FIXTURE_TOKEN: ${FIXTURE_TOKEN:?}
      STAND_PROFILE: ${STAND_PROFILE:-ai-text}
      VAULTER_PLAYWRIGHT_PATH: /work/node_modules/playwright
    volumes:
      - ${STAND_DIR:-.}/tests:/work/tests:ro
    command: ["node", "/work/tests/browser_chat_e2e.mjs"]
    networks:
      - internal
    depends_on:
      owner-http:
        condition: service_healthy

  php-test:
    profiles: ["test"]
    build:
      context: ${FIXTURE_HOST_DIR:-./.sample/host}
      dockerfile: ${STAND_DIR:-.}/docker/Dockerfile.php
      target: test-runtime
    image: vaulter-ai-stand-php-test:${STAND_RUN_ID:-sample}
    working_dir: /app
    environment:
      APP_ENV: testing
      APP_KEY: ${APP_KEY:?}
      APP_URL: http://owner-http:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${PG_DB:-vaulter_ai_office}
      DB_USERNAME: ${PG_USER:-vaulter}
      DB_PASSWORD: ${PG_PASSWORD:?}
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: array
      STAND_PROFILE: ${STAND_PROFILE:-ai-text}
      STAND_PG_ASYNC: "1"
      OWNER_HTTP_URL: http://owner-http:8000
      FIXTURE_TOKEN: ${FIXTURE_TOKEN:?}
      VAULTER_AI_DETERMINISTIC_SCRIPT: ${VAULTER_AI_DETERMINISTIC_SCRIPT:-1}
      DB_QUEUE_RETRY_AFTER: ${DB_QUEUE_RETRY_AFTER:-100}
    volumes:
      - ${STAND_DIR:-.}/tests:/app/tests:ro
      - media:/app/storage/app
    command:
      - sh
      - -c
      - php /app/vendor/bin/pest --display-warnings /app/tests/ProposalDecisionTest.php /app/tests/FinalMessageTest.php /app/tests/ChannelChatLinkTest.php
    networks:
      - internal
    depends_on:
      owner-http:
        condition: service_healthy

  python-client:
    profiles: ["test"]
    build:
      context: ${FIXTURE_PYTHON_DIR:-./.sample/python}
      dockerfile: ${STAND_DIR:-.}/docker/Dockerfile.python
    image: vaulter-ai-stand-python:${STAND_RUN_ID:-sample}
    environment:
      OFFICE_BASE_URL: http://owner-http:8000/api/vaulter-ai/v1/operations
      STAND_FIXTURE_URL: http://owner-http:8000/_fixture
      FIXTURE_TOKEN: ${FIXTURE_TOKEN:?}
    networks:
      - internal
    depends_on:
      owner-http:
        condition: service_healthy

volumes:
  pgdata:
  media:

networks:
  internal:
    driver: bridge
