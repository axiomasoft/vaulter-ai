[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vaulter-office-client"
version = "1.0.0"
description = "Thin stdlib HTTP client for the Vaulter Office SDK v1 wire protocol."
license = { text = "Proprietary" }
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["vaulter_office*"]
