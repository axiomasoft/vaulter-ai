name: CI

# PHP 8.4 and 8.5 with PostgreSQL 18.7 and 19.0. Migrations of the Vaulter
# modules and every vaulter-ai package run before unindexed-fks.sql (0 unindexed
# foreign keys). The PHP job then drops and recreates vaulter_ai_test so
# composer test migrates a clean database. It also installs Node 26.13.1, builds
# ../vaulter-sheets runtime and vue, and installs Playwright Chromium. The same
# matrix runs composer phpstan, pint --test, and composer test on SQLite and on
# PostgreSQL. Node 26.13.1 runs the Vue package. Python 3.12 runs the office
# client unit tests inside a virtualenv.
# Stop-cranes from engineering-standards §2, enforced before review:
# Zero-Royalty denylist (0 forbidden packages, no UNLICENSED, no SEE LICENSE,
# no GPL/AGPL/SSPL), 64-bit hashtextextended locks, no session pg_advisory_lock,
# no DEFERRABLE INITIALLY DEFERRED, no raw DB::transaction(), no
# set_config(..., false), no parse_url(), no ZipArchive::extractTo(), no
# CURLOPT_RESOLVE, no unindexed FK, no Helpers/Utils/Common/Misc/Traits
# directories, no @phpstan-ignore, no @psalm-suppress, no test ->skip(), no
# Eloquent Model on an #[Api] surface, no libclamav linkage, no
# registry.tiptap.dev.
# The embedded checker carries a negative fixture (--self-test) that must fail
# when a forbidden package, a banned call, or a forbidden license is introduced.
# Private sibling checkouts use secrets.VAULTER_READ_TOKEN when GitHub's default
# token cannot read axiomasoft/vaulter, vaulter-sheets, vaulter-collaboration,
# agentools, and packman. A checkout that already has those siblings is reused.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stop-cranes:
    name: Stop-cranes / Node 26.13.1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 26.13.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"

      - name: Assert Node.js >=26.13.1
        run: |
          node -e 'const parts = process.versions.node.split(".").map(Number); const ok = parts[0] > 26 || (parts[0] === 26 && (parts[1] > 13 || (parts[1] === 13 && parts[2] >= 1))); if (!ok) { console.error(process.versions.node); process.exit(1); }'
          node -e 'const engines = require("./package.json").engines || {}; if (engines.node !== ">=26.13.1") { console.error(engines); process.exit(1); }'

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-interaction

      - name: License and source stop-cranes
        run: |
          cat > "$RUNNER_TEMP/stop-cranes.py" <<'PY'
          #!/usr/bin/env python3
          """Stop-cranes for the Vaulter AI repository.

          Scans committed manifests and sources for the Zero-Royalty denylist and the
          source bans in engineering-standards §2 that a text scan can see. Exit 0
          means zero hits. ``--self-test`` proves a forbidden tree fails and an
          allowed twin passes, including UNLICENSED and SEE LICENSE manifests.
          """

          from __future__ import annotations

          import argparse
          import json
          import re
          import sys
          import tempfile
          from pathlib import Path

          FORBIDDEN_EXACT = frozenset(
              {
                  "handsontable",
                  "hyperformula",
                  "dunglas/mercure",
                  "minio/minio",
                  "exceljs",
                  "unzipper",
                  "mammoth",
                  "xlsx",
                  "libclamav",
                  "@tiptap-pro",
                  "@univerjs-pro",
                  "@univer-cli",
              }
          )
          FORBIDDEN_PREFIXES = ("@tiptap-pro/", "@univerjs-pro/", "@univer-cli/")
          DEP_KEYS = frozenset(
              {
                  "require",
                  "require-dev",
                  "conflict",
                  "dependencies",
                  "devDependencies",
                  "optionalDependencies",
                  "peerDependencies",
              }
          )
          SKIP_DIRS = frozenset(
              {
                  ".git",
                  "vendor",
                  "node_modules",
                  "build",
                  "dist",
                  "coverage",
                  ".github",
                  ".phpunit.cache",
              }
          )
          SOURCE_EXT = frozenset({".php", ".sql", ".js", ".mjs", ".cjs", ".ts", ".tsx", ".vue"})
          LOCK_NAMES = frozenset({"composer.lock", "package-lock.json", "pnpm-lock.yaml", "yarn.lock"})
          LOCK_NEEDLES = (
              "@tiptap-pro/",
              "@univerjs-pro/",
              "@univer-cli/",
              "registry.tiptap.dev",
              "handsontable",
              "hyperformula",
              "dunglas/mercure",
              "minio/minio",
              "exceljs",
              "unzipper",
              "mammoth",
              "libclamav",
              "xlsx@0.18.5",
          )
          BANNED = (
              ("hashtext(", re.compile(r"\bhashtext\s*\(")),
              ("session advisory lock", re.compile(r"\bpg_(?:try_)?advisory_lock\s*\(")),
              ("DEFERRABLE INITIALLY DEFERRED", re.compile(r"DEFERRABLE\s+INITIALLY\s+DEFERRED", re.I)),
              ("DB::transaction()", re.compile(r"\bDB::transaction\s*\(")),
              ("set_config(..., false)", re.compile(r"\bset_config\s*\([^;]*\bfalse\b", re.I)),
              ("parse_url()", re.compile(r"\bparse_url\s*\(")),
              ("ZipArchive::extractTo()", re.compile(r"\bZipArchive::extractTo\s*\(")),
              ("CURLOPT_RESOLVE", re.compile(r"\bCURLOPT_RESOLVE\b")),
              ("@phpstan-ignore", re.compile(r"@phpstan-ignore\b")),
              ("@psalm-suppress", re.compile(r"@psalm-suppress\b")),
              ("REPACK (CONCURRENTLY)", re.compile(r"\bREPACK\s*\(\s*CONCURRENTLY\b", re.I)),
              ("libclamav", re.compile(r"\blibclamav\b")),
              ("registry.tiptap.dev", re.compile(r"registry\.tiptap\.dev")),
          )
          SKIP_CALL = re.compile(r"->skip\s*\(")
          ELOQUENT = "Illuminate\\Database\\Eloquent\\Model"
          FORBIDDEN_DIR_NAMES = frozenset({"Helpers", "Utils", "Common", "Misc", "Traits"})
          COPYLEFT = re.compile(r"\b(?:AGPL|GPL|SSPL)(?:-|\b)", re.I)
          UNLICENSED_LICENSE = re.compile(r"\bUNLICENSED\b", re.I)
          SEE_LICENSE = re.compile(r"\bSEE\s+LICENSE\b", re.I)
          PYPROJECT_LICENSE = re.compile(r"(?i)^\s*license\s*=")
          MANIFEST_NAMES = frozenset({"composer.json", "package.json"})


          def forbidden_name(name: str) -> str | None:
              if name in FORBIDDEN_EXACT:
                  return name
              for prefix in FORBIDDEN_PREFIXES:
                  if name.startswith(prefix):
                      return name
              return None


          def forbidden_license(value: object) -> str | None:
              if isinstance(value, str):
                  if COPYLEFT.search(value) or UNLICENSED_LICENSE.search(value) or SEE_LICENSE.search(value):
                      return value
                  return None
              if isinstance(value, dict):
                  for item in value.values():
                      found = forbidden_license(item)
                      if found is not None:
                          return found
                  return None
              if isinstance(value, list):
                  for item in value:
                      found = forbidden_license(item)
                      if found is not None:
                          return found
              return None


          def add(hits: list[str], path: Path, detail: str) -> None:
              hits.append(f"{path}: {detail}")


          def walk_deps(node: object, hits: list[str], path: Path) -> None:
              if isinstance(node, dict):
                  name = node.get("name")
                  if isinstance(name, str):
                      bad = forbidden_name(name)
                      if bad is not None:
                          add(hits, path, f"forbidden package {bad}")
                  for license_key in ("license", "licenses"):
                      if license_key not in node:
                          continue
                      bad_license = forbidden_license(node[license_key])
                      if bad_license is not None:
                          add(hits, path, f"forbidden license {bad_license}")
                  for key, value in node.items():
                      if key in DEP_KEYS and isinstance(value, dict):
                          for dep in value:
                              if isinstance(dep, str):
                                  bad = forbidden_name(dep)
                                  if bad is not None:
                                      add(hits, path, f"forbidden dependency {bad}")
                      else:
                          walk_deps(value, hits, path)
              elif isinstance(node, list):
                  for item in node:
                      walk_deps(item, hits, path)


          def is_source(path: Path) -> bool:
              return path.name == "Dockerfile" or path.name.startswith("Dockerfile.") or path.suffix in SOURCE_EXT


          def is_test(path: Path) -> bool:
              if path.name.endswith("Test.php") or ".test." in path.name:
                  return True
              return "tests" in path.parts


          def skipped(path: Path) -> bool:
              return any(part in SKIP_DIRS for part in path.parts)


          def scan(root: Path) -> list[str]:
              hits: list[str] = []
              if not root.is_dir():
                  return [f"{root}: not a directory"]

              composer = root / "composer.json"
              if not composer.is_file():
                  hits.append(f"{composer}: missing")
              else:
                  try:
                      data = json.loads(composer.read_text(encoding="utf-8"))
                  except json.JSONDecodeError as exc:
                      hits.append(f"{composer}: invalid JSON ({exc})")
                      data = None
                  if isinstance(data, dict):
                      php = (data.get("require") or {}).get("php")
                      if php != ">=8.4 <8.6":
                          hits.append(f"{composer}: require.php must be >=8.4 <8.6, got {php!r}")

              package = root / "package.json"
              if not package.is_file():
                  hits.append(f"{package}: missing")
              else:
                  try:
                      data = json.loads(package.read_text(encoding="utf-8"))
                  except json.JSONDecodeError as exc:
                      hits.append(f"{package}: invalid JSON ({exc})")
                      data = None
                  if isinstance(data, dict):
                      node = (data.get("engines") or {}).get("node")
                      if node != ">=26.13.1":
                          hits.append(f"{package}: engines.node must be >=26.13.1, got {node!r}")

              for path in root.rglob("*"):
                  if skipped(path):
                      continue
                  if path.is_dir():
                      if path.name in FORBIDDEN_DIR_NAMES:
                          add(hits, path, "forbidden directory name")
                      continue
                  if path.name in MANIFEST_NAMES or path.name in LOCK_NAMES and path.suffix == ".json":
                      try:
                          walk_deps(json.loads(path.read_text(encoding="utf-8")), hits, path)
                      except json.JSONDecodeError as exc:
                          add(hits, path, f"invalid JSON ({exc})")
                  if path.name == "pyproject.toml":
                      text = path.read_text(encoding="utf-8", errors="replace")
                      for line in text.splitlines():
                          if PYPROJECT_LICENSE.search(line) is None:
                              continue
                          bad_license = forbidden_license(line)
                          if bad_license is not None:
                              add(hits, path, f"forbidden license {bad_license}")
                  if path.name in LOCK_NAMES:
                      text = path.read_text(encoding="utf-8", errors="replace")
                      for needle in LOCK_NEEDLES:
                          if needle in text:
                              add(hits, path, f"lockfile contains {needle}")
                  if not is_source(path):
                      continue
                  text = path.read_text(encoding="utf-8", errors="replace")
                  for label, pattern in BANNED:
                      if pattern.search(text):
                          add(hits, path, label)
                  if is_test(path) and SKIP_CALL.search(text):
                      add(hits, path, "->skip()")
                  if "#[Api]" in text and ELOQUENT in text:
                      add(hits, path, "Eloquent Model on an #[Api] surface")
              return hits


          def require_fail(label: str, root: Path) -> None:
              hits = scan(root)
              if not hits:
                  raise SystemExit(f"self-test {label}: expected hits, found none")


          def require_ok(label: str, root: Path) -> None:
              hits = scan(root)
              if hits:
                  raise SystemExit("self-test " + label + ": expected clean, got " + "; ".join(hits))


          def write_base(root: Path, node: str = ">=26.13.1", php: str = ">=8.4 <8.6") -> None:
              root.mkdir()
              (root / "composer.json").write_text(
                  json.dumps({"require": {"php": php}}),
                  encoding="utf-8",
              )
              (root / "package.json").write_text(
                  json.dumps({"engines": {"node": node}}),
                  encoding="utf-8",
              )


          def self_test() -> int:
              with tempfile.TemporaryDirectory() as tmp:
                  base = Path(tmp)

                  clean = base / "clean"
                  write_base(clean)
                  (clean / "ok.php").write_text(
                      "<?php pg_advisory_xact_lock(hashtextextended($k, 0));\n",
                      encoding="utf-8",
                  )
                  (clean / "ok.sql").write_text("DEFERRABLE INITIALLY IMMEDIATE\n", encoding="utf-8")
                  (clean / "package.json").write_text(
                      json.dumps({"engines": {"node": ">=26.13.1"}, "license": "proprietary"}),
                      encoding="utf-8",
                  )
                  (clean / "pyproject.toml").write_text('license = "Proprietary"\n', encoding="utf-8")
                  require_ok("allowed calls", clean)

                  bad_pkg = base / "pkg"
                  write_base(bad_pkg)
                  (bad_pkg / "composer.json").write_text(
                      json.dumps({"require": {"php": ">=8.4 <8.6", "handsontable": "^1.0"}}),
                      encoding="utf-8",
                  )
                  require_fail("handsontable", bad_pkg)

                  bad_scope = base / "scope"
                  write_base(bad_scope)
                  (bad_scope / "package.json").write_text(
                      json.dumps(
                          {
                              "engines": {"node": ">=26.13.1"},
                              "dependencies": {"@tiptap-pro/extension-comments": "1.0.0"},
                          }
                      ),
                      encoding="utf-8",
                  )
                  require_fail("@tiptap-pro", bad_scope)

                  bad_hash = base / "hash"
                  write_base(bad_hash)
                  (bad_hash / "lock.php").write_text("<?php hashtext($k);\n", encoding="utf-8")
                  require_fail("hashtext", bad_hash)

                  bad_lock = base / "lock"
                  write_base(bad_lock)
                  (bad_lock / "session.php").write_text("<?php pg_advisory_lock($k);\n", encoding="utf-8")
                  require_fail("pg_advisory_lock", bad_lock)

                  bad_sql = base / "sql"
                  write_base(bad_sql)
                  (bad_sql / "hot.sql").write_text(
                      "ALTER TABLE t ADD CONSTRAINT c FOREIGN KEY (id) REFERENCES p(id) DEFERRABLE INITIALLY DEFERRED;\n",
                      encoding="utf-8",
                  )
                  require_fail("INITIALLY DEFERRED", bad_sql)

                  bad_dir = base / "dirs"
                  write_base(bad_dir)
                  (bad_dir / "Helpers").mkdir()
                  require_fail("Helpers", bad_dir)

                  bad_node = base / "node"
                  write_base(bad_node, node=">=26")
                  require_fail("engines.node", bad_node)

                  bad_unlicensed = base / "unlicensed"
                  write_base(bad_unlicensed)
                  (bad_unlicensed / "package.json").write_text(
                      json.dumps({"engines": {"node": ">=26.13.1"}, "license": "UNLICENSED"}),
                      encoding="utf-8",
                  )
                  require_fail("UNLICENSED", bad_unlicensed)

                  bad_see = base / "see-license"
                  write_base(bad_see)
                  (bad_see / "composer.json").write_text(
                      json.dumps({"require": {"php": ">=8.4 <8.6"}, "license": "SEE LICENSE IN LICENSE"}),
                      encoding="utf-8",
                  )
                  require_fail("SEE LICENSE", bad_see)

                  bad_pyproject = base / "pyproject"
                  write_base(bad_pyproject)
                  (bad_pyproject / "pyproject.toml").write_text('license = "UNLICENSED"\n', encoding="utf-8")
                  require_fail("pyproject UNLICENSED", bad_pyproject)

              print("stop-crane self-test: pass")
              return 0


          def main(argv: list[str]) -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument("--root", default=".")
              parser.add_argument("--self-test", action="store_true")
              args = parser.parse_args(argv)
              if args.self_test:
                  return self_test()
              hits = scan(Path(args.root).resolve())
              if hits:
                  print(f"stop-cranes: {len(hits)} hit(s)")
                  for hit in hits:
                      print(hit)
                  return 1
              print("stop-cranes: 0 hits")
              return 0


          if __name__ == "__main__":
              sys.exit(main(sys.argv[1:]))
          PY
          python3 "$RUNNER_TEMP/stop-cranes.py" --root "$GITHUB_WORKSPACE"
          python3 "$RUNNER_TEMP/stop-cranes.py" --self-test

  php:
    name: PHP ${{ matrix.php }} / PG ${{ matrix.postgres }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        postgres: ['18.7', '19.0']
        include:
          - postgres: '18.7'
            postgres_image: postgres:18.7-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
          - postgres: '19.0'
            postgres_image: postgres:19.0-alpine@sha256:8b0ff4cdf221f0c53d7fcda681d3b461be725c492cd881c5ec9c0ad25023f188
    services:
      postgres:
        image: ${{ matrix.postgres_image }}
        env:
          POSTGRES_USER: vaulter
          POSTGRES_PASSWORD: vaulter
          POSTGRES_DB: vaulter
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql
          --health-cmd "pg_isready -U vaulter -d vaulter"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: vaulter
      PGPASSWORD: vaulter
      PGDATABASE: vaulter
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout sibling repositories
        env:
          VAULTER_READ_TOKEN: ${{ secrets.VAULTER_READ_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          workspace="$(dirname "$root")"
          fetch_dependency() {
            local directory="$1" url="$2" ref="$3"
            local dest="$workspace/$directory"
            if [ -e "$dest" ]; then
              echo "sibling present: $dest"
              return 0
            fi
            mkdir -p "$dest"
            git -C "$dest" init -q
            git -C "$dest" fetch --quiet --depth=1 "$url" "$ref"
            git -C "$dest" checkout -q -b main FETCH_HEAD
          }
          if [ -n "${VAULTER_READ_TOKEN}" ]; then
            base="https://x-access-token:${VAULTER_READ_TOKEN}@github.com/axiomasoft"
          else
            base="https://github.com/axiomasoft"
          fi
          fetch_dependency vaulter "$base/vaulter.git" refs/heads/main
          fetch_dependency vaulter-sheets "$base/vaulter-sheets.git" refs/heads/main
          fetch_dependency vaulter-collaboration "$base/vaulter-collaboration.git" refs/heads/main
          fetch_dependency agentools "$base/agentools.git" refs/heads/main
          fetch_dependency packman "$base/packman.git" refs/tags/v0.1.1

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_pgsql, pgsql, pdo_sqlite, sqlite3, pcntl, posix
          coverage: none
          tools: composer:v2

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client libatomic1

      - name: Assert PostgreSQL ${{ matrix.postgres }}
        run: |
          ver=$(psql -tAc 'SHOW server_version')
          ver=${ver//[[:space:]]/}
          echo "server_version=${ver}"
          expected="${{ matrix.postgres }}"
          case "${ver}" in
            ${expected}*) ;;
            *) echo "expected PostgreSQL ${expected}, got ${ver}" >&2; exit 1 ;;
          esac

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Setup Node.js 26.13.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"

      - name: Build vaulter-sheets runtime and vue, install Playwright Chromium
        run: |
          set -euo pipefail
          workspace="$(dirname "$GITHUB_WORKSPACE")"
          vaulter="${workspace}/vaulter"
          sheets="${workspace}/vaulter-sheets"
          (cd "${vaulter}" && npm ci --no-audit --no-fund)
          (cd "${vaulter}/packages/vue" && npm run build)
          (cd "${sheets}" && npm ci --no-audit --no-fund)
          (cd "${sheets}" && npm run build --workspace @vaulter/sheets-runtime)
          (cd "${sheets}" && npm run build --workspace @vaulter/sheets-vue)
          (cd "${sheets}" && npx playwright install --with-deps chromium)

      - name: Migrate vaulter-ai packages and require zero unindexed foreign keys
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_DATABASE: vaulter_ai_test
          DB_USERNAME: vaulter
          DB_PASSWORD: vaulter
        run: |
          set -euo pipefail
          psql -d vaulter -v ON_ERROR_STOP=1 -c "CREATE DATABASE vaulter_ai_test"
          php scripts/ci/migrate-all.php
          psql -d vaulter_ai_test -v ON_ERROR_STOP=1 -f scripts/ci/unindexed-fks.sql
          psql -d vaulter -v ON_ERROR_STOP=1 -c "CREATE DATABASE vaulter_fk_negative_test"
          psql -d vaulter_fk_negative_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE rail_parent (id bigint PRIMARY KEY);
          CREATE TABLE rail_child (parent_id bigint REFERENCES rail_parent (id));
          SQL
          if psql -d vaulter_fk_negative_test -v ON_ERROR_STOP=1 -f scripts/ci/unindexed-fks.sql >"$RUNNER_TEMP/fk-negative.log" 2>&1; then
            echo "unindexed-fks.sql did not reject an unindexed foreign key" >&2
            exit 1
          fi
          grep -q "Unindexed foreign keys detected" "$RUNNER_TEMP/fk-negative.log"

      - name: composer phpstan
        run: composer phpstan

      - name: pint --test
        run: vendor/bin/pint --test

      - name: composer test (SQLite)
        run: composer test

      - name: Recreate empty vaulter_ai_test for composer test
        run: |
          set -euo pipefail
          psql -d vaulter -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS vaulter_ai_test WITH (FORCE)"
          psql -d vaulter -v ON_ERROR_STOP=1 -c "CREATE DATABASE vaulter_ai_test"

      - name: composer test (PostgreSQL)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_DATABASE: vaulter_ai_test
          DB_USERNAME: vaulter
          DB_PASSWORD: vaulter
        run: composer test

  vue:
    name: Vue / Node 26.13.1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 26.13.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          cache: npm

      - name: npm ci, vitest, vue-tsc and vite build
        run: |
          npm ci
          npm --prefix packages/vue test
          npm --prefix packages/vue run build

  python:
    name: Python office client
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the office client in a venv and run unittest
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/office-client"
          "$RUNNER_TEMP/office-client/bin/python" -m pip install --disable-pip-version-check -e clients/python
          "$RUNNER_TEMP/office-client/bin/python" -m unittest discover -s clients/python/tests
