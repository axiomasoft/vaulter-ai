name: CI

# PHP 8.4 and 8.5 with PostgreSQL 18.7 and 19.0. Migrations of the Vaulter
# modules and every vaulter-ai package run before unindexed-fks.sql (0 unindexed
# foreign keys). The PHP job then drops and recreates vaulter_ai_test so
# composer test migrates a clean database. It also installs Node 26.13.1, builds
# ../vaulter-sheets runtime and vue, and installs Playwright Chromium. The same
# matrix runs composer phpstan, pint --test, and composer test on SQLite and on
# PostgreSQL. Node 26.13.1 runs the Vue package. Python 3.12 runs the office
# client unit tests inside a virtualenv.
# Stop-cranes from engineering-standards §2, enforced before review:
# Zero-Royalty denylist (0 forbidden packages, no UNLICENSED, no SEE LICENSE,
# no GPL/AGPL/SSPL), 64-bit hashtextextended locks, no session pg_advisory_lock,
# no DEFERRABLE INITIALLY DEFERRED, no raw DB::transaction(), no
# set_config(..., false), no parse_url(), no ZipArchive::extractTo(), no
# CURLOPT_RESOLVE, no unindexed FK, no Helpers/Utils/Common/Misc/Traits
# directories, no @phpstan-ignore, no @psalm-suppress, no test ->skip(), no
# Eloquent Model on an #[Api] surface, no libclamav linkage, no
# registry.tiptap.dev.
# The embedded checker carries a negative fixture (--self-test) that must fail
# when a forbidden package, a banned call, or a forbidden license is introduced.
# Private sibling checkouts use secrets.VAULTER_READ_TOKEN when GitHub's default
# token cannot read axiomasoft/vaulter, vaulter-sheets, vaulter-collaboration,
# agentools, and packman. A checkout that already has those siblings is reused.

on:
  push:
    branches: [main, 'refactor/**', 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 26.13.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"

      - name: Assert Node.js >=26.13.1
        run: |
          node -e 'const parts = process.versions.node.split(".").map(Number); const ok = parts[0] > 26 || (parts[0] === 26 && (parts[1] > 13 || (parts[1] === 13 && parts[2] >= 1))); if (!ok) { console.error(process.versions.node); process.exit(1); }'
          node -e 'const engines = require("./package.json").engines || {}; if (engines.node !== ">=26.13.1") { console.error(engines); process.exit(1); }'

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-interaction

      - name: License and source stop-cranes
        run: |
          python3 scripts/ci/engineering-rails.py --self-test
          python3 scripts/ci/engineering-rails.py --root .

  php:
    needs: quality
    name: PHP ${{ matrix.php }} / PG ${{ matrix.postgres }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        postgres: ['18.7', '19.0']
        include:
          - postgres: '18.7'
            postgres_image: postgres:18.7-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
          - postgres: '19.0'
            postgres_image: postgres:19.0-alpine@sha256:8b0ff4cdf221f0c53d7fcda681d3b461be725c492cd881c5ec9c0ad25023f188
    services:
      postgres:
        image: ${{ matrix.postgres_image }}
        env:
          POSTGRES_USER: vaulter
          POSTGRES_PASSWORD: vaulter
          POSTGRES_DB: vaulter
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql
          --health-cmd "pg_isready -U vaulter -d vaulter"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: vaulter
      PGPASSWORD: vaulter
      PGDATABASE: vaulter
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout sibling repositories
        env:
          VAULTER_READ_TOKEN: ${{ secrets.VAULTER_READ_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: bash scripts/ci/checkout-ecosystem.sh

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_pgsql, pgsql, pdo_sqlite, sqlite3, pcntl, posix
          coverage: none
          tools: composer:v2

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client libatomic1

      - name: Assert PostgreSQL ${{ matrix.postgres }}
        run: |
          ver=$(psql -tAc 'SHOW server_version')
          ver=${ver//[[:space:]]/}
          echo "server_version=${ver}"
          expected="${{ matrix.postgres }}"
          case "${ver}" in
            ${expected}*) ;;
            *) echo "expected PostgreSQL ${expected}, got ${ver}" >&2; exit 1 ;;
          esac

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Setup Node.js 26.13.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"

      - name: Build vaulter-sheets runtime and vue, install Playwright Chromium
        run: |
          set -euo pipefail
          workspace="$(dirname "$GITHUB_WORKSPACE")"
          vaulter="${workspace}/vaulter"
          sheets="${workspace}/vaulter-sheets"
          (cd "${vaulter}" && npm ci --no-audit --no-fund)
          (cd "${vaulter}/packages/vue" && npm run build)
          (cd "${sheets}" && npm ci --no-audit --no-fund)
          (cd "${sheets}" && npm run build --workspace @vaulter/sheets-runtime)
          (cd "${sheets}" && npm run build --workspace @vaulter/sheets-realtime)
          (cd "${sheets}" && npm run build --workspace @vaulter/sheets-vue)
          (cd "${sheets}" && npx playwright install --with-deps chromium)

      - name: Migrate vaulter-ai packages and require zero unindexed foreign keys
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_DATABASE: vaulter_ai_test
          DB_USERNAME: vaulter
          DB_PASSWORD: vaulter
        run: |
          set -euo pipefail
          psql -d vaulter -v ON_ERROR_STOP=1 -c "CREATE DATABASE vaulter_ai_test"
          php scripts/ci/migrate-all.php
          psql -d vaulter_ai_test -v ON_ERROR_STOP=1 -f scripts/ci/unindexed-fks.sql
          psql -d vaulter -v ON_ERROR_STOP=1 -c "CREATE DATABASE vaulter_fk_negative_test"
          psql -d vaulter_fk_negative_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE rail_parent (id bigint PRIMARY KEY);
          CREATE TABLE rail_child (parent_id bigint REFERENCES rail_parent (id));
          SQL
          if psql -d vaulter_fk_negative_test -v ON_ERROR_STOP=1 -f scripts/ci/unindexed-fks.sql >"$RUNNER_TEMP/fk-negative.log" 2>&1; then
            echo "unindexed-fks.sql did not reject an unindexed foreign key" >&2
            exit 1
          fi
          grep -q "Unindexed foreign keys detected" "$RUNNER_TEMP/fk-negative.log"

      - name: composer phpstan
        run: composer phpstan

      - name: pint --test
        run: vendor/bin/pint --test

      - name: composer test (SQLite)
        run: composer test

      - name: Recreate empty vaulter_ai_test for composer test
        run: |
          set -euo pipefail
          psql -d vaulter -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS vaulter_ai_test WITH (FORCE)"
          psql -d vaulter -v ON_ERROR_STOP=1 -c "CREATE DATABASE vaulter_ai_test"

      - name: composer test (PostgreSQL)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_DATABASE: vaulter_ai_test
          DB_USERNAME: vaulter
          DB_PASSWORD: vaulter
        run: composer test

  vue:
    needs: quality
    name: Vue / Node 26.13.1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 26.13.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          cache: npm

      - name: npm ci, vitest, vue-tsc and vite build
        run: |
          npm ci
          npm --prefix packages/vue test
          npm --prefix packages/vue run build

  python:
    needs: quality
    name: Python office client
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the office client in a venv and run unittest
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/office-client"
          cd clients/python
          "$RUNNER_TEMP/office-client/bin/python" -m pip install --upgrade 'pip>=25.1'
          "$RUNNER_TEMP/office-client/bin/python" -m pip install --group dev -e .
          "$RUNNER_TEMP/office-client/bin/ruff" check .
          "$RUNNER_TEMP/office-client/bin/ruff" format --check .
          "$RUNNER_TEMP/office-client/bin/mypy"
          "$RUNNER_TEMP/office-client/bin/python" -m unittest discover -s tests

  ci-gate:
    name: CI gate
    if: always()
    needs: [quality, php, vue, python]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all lanes to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
